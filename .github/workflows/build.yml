name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # WCH GCC 15.2 (riscv32-wch-elf-*) and CMake, from xrobot-org/Docker-Image, pinned by
    # digest so that every run uses the same toolchain.
    container: xrimage/xrimage-ch32-riscv@sha256:b430bc8977b7f209a5cada62bb3682eb8f9656f16dbffbcd5de8a3166d61e476
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Build bootloaders and applications (evt, wdap, v305)
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          tools/build.sh evt wdap v305
      - uses: actions/upload-artifact@v4
        with:
          name: xrdap-ch32v307-${{ github.sha }}
          path: build/images/

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: PC tests of the pure logic
        run: |
          cmake -S tests -B build/tests
          cmake --build build/tests
          ctest --test-dir build/tests --output-on-failure
